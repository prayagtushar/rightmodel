appId: com.prayagtushar.switchtower
productName: Switchtower
directories:
  output: release
files:
  - out/**
asarUnpack:
  - "**/*.node"
npmRebuild: true
mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
