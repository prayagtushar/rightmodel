name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: dist:mac
            artifact: apps/desktop/release/*.dmg
          - os: windows-latest
            target: dist:win
            artifact: apps/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Core tests
        run: pnpm -F rightmodel test

      # The desktop suite gates the artifact this workflow ships, so it has to
      # run here and not only in ci.yml.
      - name: Desktop smoke test
        run: pnpm -F @rightmodel/desktop test

      - name: Build core
        run: pnpm -F rightmodel build

      - name: Build installer
        run: pnpm -F @rightmodel/desktop ${{ matrix.target }}
        env:
          # Builds are unsigned. See the note in README.md.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          draft: true
          generate_release_notes: true
