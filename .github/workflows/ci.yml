name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because the pty and argv quoting paths
        # differ there and CI is the only place they get exercised.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Core tests
        run: pnpm -F rightmodel test

      - name: Benchmark
        run: pnpm -F rightmodel bench

      # The Electron smoke test needs a display on Linux.
      - name: Desktop smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum pnpm -F @rightmodel/desktop test

      - name: Desktop smoke test
        if: matrix.os != 'ubuntu-latest'
        run: pnpm -F @rightmodel/desktop test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/desktop/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F rightmodel test:coverage
